[flake8]
ignore = E221
exclude = .git,__init__.py,examples/thermal-flow-between-cylinders/postprocessing/postprocess.py
max-complexity = 60
max-line-length = 80
per-file-ignores =
    fenicsR13/solver.py:W503,W504
    fenicsR13/tensoroperations.py:W503,W504
    # Same reason as the two modules above: these carry the tensor algebra
    # and the balance equations, which stay readable only when a long sum is
    # broken before the operator. W503 and W504 contradict each other, so one
    # of them has to be waived either way; flake8 waives both by default.
    tests/2d_r14/esols/layer_rates.py:W503,W504
    tests/2d_r14/esols/verify_exact_solution.py:W503,W504
    tests/2d_r14/esols/verify_boundary_conditions.py:W503,W504
